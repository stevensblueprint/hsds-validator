[project]
name = "hsds-validator"
version = "0.1.3"
authors = [
    { name="Stevens Blueprint", email="blueprint@stevens.edu"},
    { name="Alexis Emerson", email="aemerson1@stevens.edu" }
]
description = "Verifying provided files comply with HSDS specification."
requires-python = ">=3.13"
dependencies = [
    "pydantic[email]>=2.11.7",
    "dydantic>=0.0.8",
    "click>=8.2.1",
]
readme = "README_PYPI.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hsds_validator"]
exclude = [
    "examples/",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.20",
]
cli = [
]
all = [
    "hsds-validator[api]",
    "hsds-validator[cli]",
]

[project.scripts]
hsds-validate = "hsds_validator.cli.main:main"
hsds-api = "hsds_validator.api.main:main"
