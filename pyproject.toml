[project]
name = "hsds-validator"
version = "0.1.0"
authors = [
    { name="Stevens Blueprint", email="blueprint@stevens.edu"}
]
description = "Verifying provided files comply with HSDS specification."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11.7",
    "click>=8.2.1",
]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hsds_validator"]

[project.optional-dependencies]
api = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
]
cli = [
    "click>=8.2.1",
]
all = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "click>=8.2.1",
]

[project.scripts]
hsds-validate = "hsds_validator.cli.main:main"
hsds-api = "hsds_validator.api.main:main"
